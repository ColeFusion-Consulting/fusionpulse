# FusionPulse nginx config — served on fp-dev / fp-staging containers behind
# the Proxmox NPM reverse proxy. Tracked in git and pushed by the deploy
# workflows (see .github/workflows/deploy-dev.yml / deploy-staging.yml).
#
# Two virtual hosts share this single container:
#   - fusionpulse.colefusion.net       -> marketing site (static Astro build)
#   - app.fusionpulse.colefusion.net   -> product dashboard (React SPA) + API

# Marketing site
server {
    listen 80;
    server_name fusionpulse.colefusion.net fusionpulse.colefusion.com;

    root /opt/fusionpulse/marketing/dist;
    index index.html;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}

# Product dashboard + API (default host — also catches direct IP access)
server {
    listen 80 default_server;
    server_name app.fusionpulse.colefusion.net app.fusionpulse.colefusion.com api.fusionpulse.colefusion.com _;

    # Frontend (React SPA)
    location / {
        root /opt/fusionpulse/web/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API proxy
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
