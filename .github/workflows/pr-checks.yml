name: PR Checks

on:
  pull_request:
    branches: [main, develop]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [api, test-runner, web, cli]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: packages/${{ matrix.package }}

  build:
    runs-on: ubuntu-latest
    needs: typecheck
    strategy:
      matrix:
        package: [api, test-runner, web, cli]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Build
        run: npm run build
        working-directory: packages/${{ matrix.package }}

  test:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        package: [api, test-runner, web, cli]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Test
        run: npm test
        working-directory: packages/${{ matrix.package }}
