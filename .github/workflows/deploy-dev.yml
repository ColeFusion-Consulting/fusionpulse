name: Deploy to Dev (Proxmox)

on:
  push:
    branches: [dev]
  workflow_dispatch:

env:
  CONTAINER_ID: "106"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Build all packages
        run: npx turbo run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: |
            packages/api/dist/
            packages/api/package.json
            packages/test-runner/dist/
            packages/test-runner/package.json
            packages/web/dist/
            packages/web/package.json
          retention-days: 1

  deploy:
    needs: build
    runs-on: [self-hosted, proxmox]
    environment: dev

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: build/

      - name: Deploy to container
        run: |
          set -e
          CT=${{ env.CONTAINER_ID }}
          BUILD=$PWD/build

          echo "Deploying to fp-dev container $CT..."

          # Tar each package for transfer
          cd $BUILD/packages/api && tar czf /tmp/api.tar.gz dist/ package.json && cd -
          cd $BUILD/packages/test-runner && tar czf /tmp/test-runner.tar.gz dist/ package.json && cd -
          cd $BUILD/packages/web && tar czf /tmp/web.tar.gz dist/ package.json && cd -

          # Push tars into container
          sudo pct push $CT /tmp/api.tar.gz /tmp/api.tar.gz
          sudo pct push $CT /tmp/test-runner.tar.gz /tmp/test-runner.tar.gz
          sudo pct push $CT /tmp/web.tar.gz /tmp/web.tar.gz

          # Extract, install, restart
          sudo pct exec $CT -- bash -c "cd /opt/fusionpulse/api && tar xzf /tmp/api.tar.gz && npm install --production 2>/dev/null"
          sudo pct exec $CT -- bash -c "cd /opt/fusionpulse/test-runner && tar xzf /tmp/test-runner.tar.gz && npm install --production 2>/dev/null"
          sudo pct exec $CT -- bash -c "cd /opt/fusionpulse/web && tar xzf /tmp/web.tar.gz"
          sudo pct exec $CT -- bash -c "pm2 restart fusionpulse-api || (cd /opt/fusionpulse/api && pm2 start dist/index.js --name fusionpulse-api)"
          sudo pct exec $CT -- bash -c "pm2 restart fusionpulse-runner || (cd /opt/fusionpulse/test-runner && pm2 start dist/worker.js --name fusionpulse-runner)"
          sudo pct exec $CT -- bash -c "pm2 save"
          sudo pct exec $CT -- bash -c "nginx -t && systemctl reload nginx"

          echo "Dev deployment complete"

      - name: Health Check
        run: |
          sleep 5
          CT=${{ env.CONTAINER_ID }}
          STATUS=$(sudo pct exec $CT -- curl -s http://localhost:3001/api/health 2>/dev/null || echo '{"status":"error"}')
          echo "Health: $STATUS"
          if echo "$STATUS" | grep -q '"status"'; then
            echo "Dev deployment successful"
          else
            echo "Health check inconclusive (API may need .env configured)"
          fi
