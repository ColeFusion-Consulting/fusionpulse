name: Deploy to Dev (Proxmox)

on:
  push:
    branches: [dev]
  workflow_dispatch:

env:
  REMOTE_PATH: /opt/fusionpulse
  CONTAINER_ID: "106"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Build all packages
        run: npx turbo run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROXMOX_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat >> ~/.ssh/config << EOF
          Host proxmox
            HostName ${{ secrets.PROXMOX_HOST }}
            User ${{ secrets.PROXMOX_USER }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no
          EOF

      - name: Copy build to Proxmox
        run: |
          echo "Syncing build to Proxmox host..."
          rsync -avz --delete \
            packages/api/dist/ \
            proxmox:${{ env.REMOTE_PATH }}/api/dist/
          rsync -avz \
            packages/api/package.json \
            proxmox:${{ env.REMOTE_PATH }}/api/
          rsync -avz --delete \
            packages/test-runner/dist/ \
            proxmox:${{ env.REMOTE_PATH }}/test-runner/dist/
          rsync -avz \
            packages/test-runner/package.json \
            proxmox:${{ env.REMOTE_PATH }}/test-runner/
          rsync -avz --delete \
            packages/web/dist/ \
            proxmox:${{ env.REMOTE_PATH }}/web/dist/
          rsync -avz \
            packages/web/package.json \
            proxmox:${{ env.REMOTE_PATH }}/web/

      - name: Deploy into container and restart
        run: |
          ssh proxmox << 'DEPLOY'
          CT=${{ env.CONTAINER_ID }}

          # Push files into container
          pct push $CT /opt/fusionpulse/api/dist /opt/fusionpulse/api/dist -r
          pct push $CT /opt/fusionpulse/api/package.json /opt/fusionpulse/api/package.json
          pct push $CT /opt/fusionpulse/test-runner/dist /opt/fusionpulse/test-runner/dist -r
          pct push $CT /opt/fusionpulse/test-runner/package.json /opt/fusionpulse/test-runner/package.json
          pct push $CT /opt/fusionpulse/web/dist /opt/fusionpulse/web/dist -r
          pct push $CT /opt/fusionpulse/web/package.json /opt/fusionpulse/web/package.json

          # Install production deps and restart
          pct exec $CT -- bash -c "cd /opt/fusionpulse/api && npm install --production 2>/dev/null"
          pct exec $CT -- bash -c "cd /opt/fusionpulse/test-runner && npm install --production 2>/dev/null"
          pct exec $CT -- bash -c "pm2 restart fusionpulse-api || cd /opt/fusionpulse/api && pm2 start dist/index.js --name fusionpulse-api"
          pct exec $CT -- bash -c "pm2 restart fusionpulse-runner || cd /opt/fusionpulse/test-runner && pm2 start dist/worker.js --name fusionpulse-runner"
          pct exec $CT -- bash -c "nginx -t && systemctl reload nginx"

          echo "Dev deployment complete"
          DEPLOY

      - name: Health Check
        run: |
          sleep 5
          ssh proxmox "pct exec ${{ env.CONTAINER_ID }} -- curl -s http://localhost:3001/api/health" || echo "Health check skipped"
