name: Deploy to Staging (Proxmox)

on:
  push:
    branches: [staging]
  workflow_dispatch:

env:
  CONTAINER_ID: "108"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Run Typecheck
        run: npx turbo run typecheck

      - name: Build all packages
        run: npx turbo run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: |
            packages/api/dist/
            packages/api/package.json
            packages/test-runner/dist/
            packages/test-runner/package.json
            packages/web/dist/
            packages/web/package.json
          retention-days: 1

  deploy:
    needs: build
    runs-on: [self-hosted, proxmox]
    environment: staging

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: /tmp/fp-deploy/

      - name: Create tarballs
        run: |
          cd /tmp/fp-deploy
          tar czf /tmp/api.tar.gz api/
          tar czf /tmp/test-runner.tar.gz test-runner/
          tar czf /tmp/web.tar.gz web/

      - name: Deploy to container
        run: |
          set -e
          CT=${{ env.CONTAINER_ID }}

          echo "Deploying to fp-staging container $CT..."

          sudo pct push $CT /tmp/api.tar.gz /tmp/api.tar.gz
          sudo pct push $CT /tmp/test-runner.tar.gz /tmp/test-runner.tar.gz
          sudo pct push $CT /tmp/web.tar.gz /tmp/web.tar.gz

          sudo pct exec $CT -- bash -c "cd /opt/fusionpulse/api && tar xzf /tmp/api.tar.gz --strip-components=1 && npm install --production 2>/dev/null"
          sudo pct exec $CT -- bash -c "cd /opt/fusionpulse/test-runner && tar xzf /tmp/test-runner.tar.gz --strip-components=1 && npm install --production 2>/dev/null"
          sudo pct exec $CT -- bash -c "cd /opt/fusionpulse/web && tar xzf /tmp/web.tar.gz --strip-components=1"
          sudo pct exec $CT -- bash -c "pm2 restart fusionpulse-api || (cd /opt/fusionpulse/api && pm2 start dist/index.js --name fusionpulse-api)"
          sudo pct exec $CT -- bash -c "pm2 restart fusionpulse-runner || (cd /opt/fusionpulse/test-runner && pm2 start dist/worker.js --name fusionpulse-runner)"
          sudo pct exec $CT -- bash -c "pm2 save"
          sudo pct exec $CT -- bash -c "nginx -t && systemctl reload nginx"

          echo "Staging deployment complete"

      - name: Health Check
        run: |
          sleep 5
          CT=${{ env.CONTAINER_ID }}
          STATUS=$(sudo pct exec $CT -- curl -s http://localhost:3001/api/health 2>/dev/null || echo '{"status":"error"}')
          echo "Health: $STATUS"
