name: Deploy to Staging (Proxmox)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DEPLOY_HOST: ${{ secrets.PROXMOX_STAGING_HOST }}
  DEPLOY_USER: ${{ secrets.PROXMOX_DEPLOY_USER }}
  REMOTE_PATH: /opt/fusionpulse

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Build all packages
        run: npx turbo run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROXMOX_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo -e "Host proxmox-staging\n  HostName ${{ secrets.PROXMOX_STAGING_HOST }}\n  User ${{ secrets.PROXMOX_DEPLOY_USER }}\n  IdentityFile ~/.ssh/deploy_key\n  StrictHostKeyChecking no" > ~/.ssh/config

      - name: Run Typecheck
        run: npx turbo run typecheck

      - name: Deploy API
        run: |
          echo "Deploying API to staging..."
          rsync -avz --delete \
            packages/api/dist/ \
            proxmox-staging:${{ env.REMOTE_PATH }}/api/dist/
          rsync -avz --delete \
            packages/api/package.json \
            proxmox-staging:${{ env.REMOTE_PATH }}/api/

      - name: Deploy Test Runner
        run: |
          echo "Deploying test runner to staging..."
          rsync -avz --delete \
            packages/test-runner/dist/ \
            proxmox-staging:${{ env.REMOTE_PATH }}/test-runner/dist/

      - name: Deploy Frontend
        run: |
          echo "Deploying frontend to staging..."
          rsync -avz --delete \
            packages/web/dist/ \
            proxmox-staging:${{ env.REMOTE_PATH }}/web/dist/

      - name: Restart Services
        run: |
          ssh proxmox-staging << 'EOF'
            cd /opt/fusionpulse
            pm2 restart fusionpulse-api || pm2 start api/dist/index.js --name fusionpulse-api
            pm2 restart fusionpulse-runner || pm2 start test-runner/dist/worker.js --name fusionpulse-runner
            nginx -t && systemctl reload nginx
            echo "Staging deployment complete"
          EOF

      - name: Health Check
        run: |
          sleep 5
          STATUS=$(ssh proxmox-staging "curl -s http://localhost:3001/api/health" || echo '{"status":"error"}')
          echo "Health: $STATUS"
          if echo "$STATUS" | grep -q '"status":"ok"'; then
            echo "✅ Staging deployment successful"
          else
            echo "❌ Staging health check failed!"
            exit 1
          fi
