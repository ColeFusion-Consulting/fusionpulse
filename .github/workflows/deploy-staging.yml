name: Deploy to Staging (Proxmox)

on:
  push:
    branches: [staging]
  workflow_dispatch:

env:
  REMOTE_PATH: /opt/fusionpulse
  CONTAINER_ID: "108"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Run Typecheck
        run: npx turbo run typecheck

      - name: Build all packages
        run: npx turbo run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: |
            packages/api/dist/
            packages/api/package.json
            packages/test-runner/dist/
            packages/test-runner/package.json
            packages/web/dist/
            packages/web/package.json
          retention-days: 1

  deploy:
    needs: build
    runs-on: [self-hosted, proxmox]
    environment: staging

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: /opt/actions-runner/_work/build/

      - name: Deploy to container
        run: |
          set -e
          BUILD=/opt/actions-runner/_work/build
          CT=${{ env.CONTAINER_ID }}

          echo "Deploying to fp-staging container $CT..."

          sudo pct push $CT $BUILD/packages/api/dist /opt/fusionpulse/api/dist -r
          sudo pct push $CT $BUILD/packages/api/package.json /opt/fusionpulse/api/package.json
          sudo pct push $CT $BUILD/packages/test-runner/dist /opt/fusionpulse/test-runner/dist -r
          sudo pct push $CT $BUILD/packages/test-runner/package.json /opt/fusionpulse/test-runner/package.json
          sudo pct push $CT $BUILD/packages/web/dist /opt/fusionpulse/web/dist -r
          sudo pct push $CT $BUILD/packages/web/package.json /opt/fusionpulse/web/package.json

          sudo pct exec $CT -- bash -c "cd /opt/fusionpulse/api && npm install --production 2>/dev/null"
          sudo pct exec $CT -- bash -c "cd /opt/fusionpulse/test-runner && npm install --production 2>/dev/null"
          sudo pct exec $CT -- bash -c "pm2 restart fusionpulse-api || (cd /opt/fusionpulse/api && pm2 start dist/index.js --name fusionpulse-api)"
          sudo pct exec $CT -- bash -c "pm2 restart fusionpulse-runner || (cd /opt/fusionpulse/test-runner && pm2 start dist/worker.js --name fusionpulse-runner)"
          sudo pct exec $CT -- bash -c "pm2 save"
          sudo pct exec $CT -- bash -c "nginx -t && systemctl reload nginx"

          echo "Staging deployment complete"

      - name: Health Check
        run: |
          sleep 5
          CT=${{ env.CONTAINER_ID }}
          STATUS=$(sudo pct exec $CT -- curl -s http://localhost:3001/api/health 2>/dev/null || echo '{"status":"error"}')
          echo "Health: $STATUS"
          if echo "$STATUS" | grep -q '"status"'; then
            echo "Staging deployment successful"
          else
            echo "Health check inconclusive (API may need .env configured)"
          fi
